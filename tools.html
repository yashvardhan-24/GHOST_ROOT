<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT_ACCESS // TOOLS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="hacker-theme" data-page="tools">
    <canvas id="matrix-canvas"></canvas>
    <audio id="click-sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="hover-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <nav class="navbar">
        <div class="nav-brand"><span class="terminal-icon">#</span><span class="brand-text">GHOST_ROOT</span></div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> HOME</a></li>
            <li><a href="whoami.html" class="nav-link"><i class="fas fa-user-secret"></i> WHOAMI</a></li>
            <li><a href="threats.html" class="nav-link"><i class="fas fa-shield-virus"></i> THREATS</a></li>
            <li><a href="services.html" class="nav-link"><i class="fas fa-cogs"></i> SERVICES</a></li>
            <li><a href="academy.html" class="nav-link"><i class="fas fa-graduation-cap"></i> ACADEMY</a></li>
            <li><a href="tools.html" class="nav-link active"><i class="fas fa-terminal"></i> TOOLS</a></li>
            <li><a href="ai.html" class="nav-link"><i class="fas fa-robot"></i> GHOST_AI</a></li>
            <li><a href="contact.html" class="nav-link"><i class="fas fa-envelope"></i> CONTACT</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <section id="tools" class="page-section active">
            <div class="container">
                <h1 class="section-title">SECURITY_TOOLKIT</h1>
                <div class="tools-interactive-grid">
                    <div class="tool-widget" id="hash-tool">
                        <div class="tool-widget-header">HASH_IDENTIFIER</div>
                        <div class="tool-widget-body">
                            <input type="text" placeholder="Enter Hash String..." id="hash-id-input">
                            <button id="identify-hash-btn">IDENTIFY</button>
                            <div class="tool-result" id="hash-id-result"></div>
                        </div>
                    </div>
                    <div class="tool-widget" id="scanner-tool">
                        <div class="tool-widget-header">MALWARE_URL_SCAN</div>
                        <div class="tool-widget-body">
                            <input type="text" placeholder="https://..." id="url-scan-input">
                            <button id="scan-url-btn">SCAN_URL</button>
                            <div class="tool-result" id="url-scan-result"></div>
                        </div>
                    </div>
                    <div class="tool-widget" id="lookup-tool">
                        <div class="tool-widget-header">IP_INTEL_LOOKUP</div>
                        <div class="tool-widget-body">
                            <input type="text" placeholder="8.8.8.8" id="ip-lookup-input">
                            <button id="lookup-ip-btn">GET_INTEL</button>
                            <div class="tool-result" id="ip-lookup-result"></div>
                        </div>
                    </div>
                    <div class="tool-widget" id="strength-tool">
                        <div class="tool-widget-header">PW_FORTRESS</div>
                        <div class="tool-widget-body">
                            <input type="password" placeholder="Test Strength..." id="pw-strength-input">
                            <div class="strength-meter"><div class="meter-bar"></div></div>
                            <div class="tool-result" id="pw-strength-result"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
